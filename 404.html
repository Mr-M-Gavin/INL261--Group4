<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 — Page Not Found · The Gardener</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--moss:#3a5a40;--sage:#588157;--fern:#a3b18a;--cream:#faf6ef;--petal:#d4a96a;--dark2:#223d24;--dark3:#111a12;--font-display:'Playfair Display',serif;--font-body:'Lato',sans-serif;--ease-spring:cubic-bezier(.16,1,.3,1)}
html,body{height:100%}
body{font-family:var(--font-body);background:var(--dark3);color:var(--cream);cursor:none;overflow:hidden;display:flex;align-items:center;justify-content:center}
#cursor{position:fixed;width:36px;height:36px;border:1.5px solid var(--sage);border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:width .3s var(--ease-spring),height .3s var(--ease-spring),border-color .3s ease;mix-blend-mode:difference}
#cursor-dot{position:fixed;width:6px;height:6px;background:var(--petal);border-radius:50%;pointer-events:none;z-index:10000;transform:translate(-50%,-50%)}
canvas{position:fixed;inset:0;z-index:0;pointer-events:none}
.content{position:relative;z-index:1;text-align:center;padding:2rem;max-width:560px}
.big-num{font-family:var(--font-display);font-size:clamp(7rem,20vw,14rem);font-weight:700;line-height:1;color:var(--moss);letter-spacing:-.04em;opacity:.35;user-select:none;animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:.45}}
.leaf-icon{font-size:3rem;display:block;margin:-1.5rem 0 1rem;animation:sway 2.5s ease-in-out infinite;transform-origin:center bottom}
@keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
h1{font-family:var(--font-display);font-size:clamp(1.6rem,3.5vw,2.4rem);font-weight:700;color:var(--cream);margin-bottom:.8rem;line-height:1.1}
p{font-size:.9rem;color:rgba(250,246,239,.65);line-height:1.75;margin-bottom:2rem;font-weight:300}
.btn-home{display:inline-block;padding:.85rem 2.4rem;background:var(--sage);color:var(--dark3);font-family:var(--font-body);font-size:.8rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;text-decoration:none;transition:background .3s ease,transform .3s var(--ease-spring);border-radius:2px}
.btn-home:hover{background:var(--petal);transform:translateY(-2px)}
.tagline{margin-top:2rem;font-size:.65rem;letter-spacing:.25em;text-transform:uppercase;color:rgba(163,177,138,.4)}
</style>
</head>
<body>
<div id="cursor"></div>
<div id="cursor-dot"></div>
<canvas id="bg-canvas"></canvas>
<div class="content">
  <div class="big-num">404</div>
  <span class="leaf-icon">🌿</span>
  <h1>This path hasn't been planted yet.</h1>
  <p>The page you're looking for doesn't exist — but the campus gardens are still looking beautiful. Head back home and find what you need.</p>
  <a href="index.html" class="btn-home">Back to Home</a>
  <p class="tagline">The Gardener · Belgium Campus iTversity</p>
</div>
<script>
'use strict';
(function(){
  const ring=document.getElementById('cursor'),dot=document.getElementById('cursor-dot');
  if(!ring||!dot)return;
  let mx=-100,my=-100,cx=-100,cy=-100;
  document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});
  (function loop(){cx+=(mx-cx)*.15;cy+=(my-cy)*.15;ring.style.left=cx+'px';ring.style.top=cy+'px';dot.style.left=mx+'px';dot.style.top=my+'px';requestAnimationFrame(loop);})();
  document.querySelectorAll('a').forEach(el=>{
    el.addEventListener('mouseenter',()=>{ring.style.width='60px';ring.style.height='60px';ring.style.borderColor='var(--petal)';});
    el.addEventListener('mouseleave',()=>{ring.style.width='36px';ring.style.height='36px';ring.style.borderColor='var(--sage)';});
  });
})();
(function(){
  const canvas=document.getElementById('bg-canvas');if(!canvas)return;
  const ctx=canvas.getContext('2d');let W,H,particles;
  function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
  function P(){this.reset();}
  P.prototype.reset=function(){this.x=Math.random()*W;this.y=Math.random()*H;this.r=Math.random()*1.8+.4;this.alpha=Math.random()*.5+.1;this.speed=Math.random()*.4+.1;this.angle=Math.random()*Math.PI*2;this.drift=(Math.random()-.5)*.01;const r=Math.random();this.colour=r<.6?'88,129,87':r<.9?'163,177,138':'212,169,106';};
  P.prototype.update=function(){this.angle+=this.drift;this.x+=Math.cos(this.angle)*this.speed;this.y-=this.speed*.6;if(this.y<-10){this.reset();this.y=H+10;}};
  P.prototype.draw=function(){ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fillStyle=`rgba(${this.colour},${this.alpha})`;ctx.fill();};
  function init(){resize();particles=Array.from({length:80},()=>new P());}
  function loop(){ctx.clearRect(0,0,W,H);particles.forEach(p=>{p.update();p.draw();});requestAnimationFrame(loop);}
  window.addEventListener('resize',resize);init();loop();
})();
</script>
</body>
</html>
